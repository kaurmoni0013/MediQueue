<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- browser chrome -->
  <rect width="1280" height="64" fill="#f1f5f9"/>
  <circle cx="28" cy="32" r="6" fill="#ff5c72"/>
  <circle cx="50" cy="32" r="6" fill="#f5a623"/>
  <circle cx="72" cy="32" r="6" fill="#38c984"/>
  <rect x="120" y="18" width="900" height="28" rx="4" fill="#ffffff" stroke="#dfe6ee"/>
  <text x="135" y="37" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#94a3b8">app.mediqueue.local/patient/dashboard</text>
  <text x="1090" y="37" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">Moni Kaur</text>

  <!-- wrapper -->
  <rect y="64" width="1280" height="696" fill="url(#bg)"/>

  <!-- sidebar -->
  <rect x="0" y="64" width="238" height="696" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="16" y="84" width="30" height="30" fill="#f5a623" rx="3"/>
  <rect x="27" y="95" width="8" height="8" fill="#1a1203"/>
  <text x="58" y="99" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0f172a">MediQueue</text>
  <text x="58" y="115" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="1" fill="#94a3b8">CLINIC OPERATIONS</text>

  <text x="16" y="152" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="2" fill="#94a3b8">PATIENT PORTAL</text>

  <!-- nav -->
  <g font-family="'Segoe UI', sans-serif" font-size="14">
    <rect x="8" y="164" width="222" height="36" rx="4" fill="rgba(245,166,35,0.12)"/>
    <rect x="8" y="164" width="3" height="36" fill="#f5a623"/>
    <rect x="18" y="176" width="5" height="5" fill="#f5a623"/>
    <text x="32" y="187" fill="#0f172a" font-weight="600">Dashboard</text>

    <rect x="18" y="222" width="5" height="5" fill="#cbd5e1"/>
    <text x="32" y="233" fill="#64748b">Doctors</text>
    <rect x="18" y="262" width="5" height="5" fill="#cbd5e1"/>
    <text x="32" y="273" fill="#64748b">Book Appointment</text>
    <rect x="18" y="302" width="5" height="5" fill="#cbd5e1"/>
    <text x="32" y="313" fill="#64748b">My Appointments</text>
    <rect x="18" y="342" width="5" height="5" fill="#cbd5e1"/>
    <text x="32" y="353" fill="#64748b">Profile</text>
  </g>

  <!-- user chip -->
  <rect x="12" y="690" width="214" height="54" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="40" cy="717" r="16" fill="#eef2f7"/>
  <text x="34" y="722" font-family="'Segoe UI', sans-serif" font-size="12" fill="#b45309">RM</text>
  <text x="64" y="716" font-family="'Segoe UI', sans-serif" font-size="13" fill="#0f172a">Rahul Mehta</text>
  <text x="64" y="732" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Patient</text>

  <!-- main column -->
  <g>
    <text x="266" y="116" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Thursday, 24 September 2026</text>
    <text x="266" y="152" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0f172a">Good morning, Rahul</text>
    <text x="266" y="176" font-family="'Segoe UI', sans-serif" font-size="14" fill="#64748b">Here is an overview of your care at MediQueue Clinic.</text>

