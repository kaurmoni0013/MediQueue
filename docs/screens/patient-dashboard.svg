    <text x="266" y="296" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0f172a">Next appointment</text>

    <circle cx="308" cy="362" r="26" fill="#eef2f7"/>
    <text x="298" y="368" font-family="'Segoe UI', sans-serif" font-size="14" fill="#b45309">AS</text>
    <text x="348" y="358" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0f172a">Dr. Ananya Sharma</text>
    <text x="348" y="378" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">General Medicine</text>
    <rect x="348" y="392" width="104" height="22" rx="4" fill="rgba(245,166,35,0.15)" stroke="rgba(245,166,35,0.4)"/>
    <circle cx="362" cy="403" r="4" fill="#f5a623"/>
    <text x="374" y="407" font-family="'Segoe UI', sans-serif" font-size="12" fill="#b45309">WAITING</text>

    <text x="560" y="350" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="2" fill="#94a3b8">WHEN</text>
    <text x="560" y="372" font-family="'Segoe UI', sans-serif" font-size="15" fill="#0f172a">Today · 10:00 AM</text>
    <text x="560" y="394" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Duration 15 minutes</text>

    <text x="742" y="350" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="2" fill="#94a3b8">QUEUE</text>
    <text x="742" y="372" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" fill="#b45309">#2</text>
    <text x="778" y="372" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#0f172a">· est. wait ~15 min</text>
    <text x="742" y="394" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Updated live · based on current queue</text>

    <rect x="1048" y="336" width="132" height="36" rx="4" fill="#f5a623"/>
    <text x="1066" y="359" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1a1203">View appointment</text>

    <!-- upcoming table -->
    <rect x="266" y="456" width="932" height="232" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="284" y="486" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0f172a">Upcoming appointments</text>
    <g font-family="'Courier New', Consolas, monospace" font-size="12">
      <text x="284" y="522" fill="#94a3b8">WHEN</text>
      <text x="450" y="522" fill="#94a3b8">DOCTOR</text>
      <text x="650" y="522" fill="#94a3b8">STATUS</text>
      <text x="840" y="522" fill="#94a3b8">QUEUE</text>
      <text x="930" y="522" fill="#94a3b8">WAIT</text>
    </g>
    <rect x="266" y="532" width="932" height="1" fill="#eef2f6"/>

    <g font-family="'Segoe UI', sans-serif" font-size="13">
      <text x="284" y="566" font-family="'Courier New', Consolas, monospace" fill="#0f172a">10:00 AM · Thu, 24 Sep</text>
      <text x="450" y="566" fill="#0f172a">Dr. Ananya Sharma</text>
      <rect x="644" y="554" width="104" height="22" rx="4" fill="rgba(245,166,35,0.15)" stroke="rgba(245,166,35,0.4)"/>
      <text x="662" y="568" font-size="11" fill="#b45309">WAITING</text>
      <text x="840" y="566" font-family="'Courier New', Consolas, monospace" fill="#b45309">#2</text>
      <text x="930" y="566" font-family="'Courier New', Consolas, monospace" fill="#0f172a">~15 min</text>

      <text x="284" y="610" font-family="'Courier New', Consolas, monospace" fill="#0f172a">11:15 AM · Thu, 24 Sep</text>
      <text x="450" y="610" fill="#0f172a">Dr. Ananya Sharma</text>
      <rect x="644" y="598" width="112" height="22" rx="4" fill="rgba(61,126,166,0.14)" stroke="rgba(61,126,166,0.35)"/>
      <text x="662" y="612" font-size="11" fill="#3d7ea6">SCHEDULED</text>
      <text x="840" y="610" font-family="'Courier New', Consolas, monospace" fill="#b45309">#4</text>
      <text x="930" y="610" font-family="'Courier New', Consolas, monospace" fill="#0f172a">~45 min</text>
    </g>
