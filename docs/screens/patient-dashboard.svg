      <text x="284" y="234" font-size="11" letter-spacing="2" fill="#64748b">UPCOMING</text>
      <text x="284" y="266" font-size="28" font-weight="700" fill="#b45309">3</text>

      <rect x="582" y="204" width="300" height="76" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="600" y="234" font-size="11" letter-spacing="2" fill="#64748b">COMPLETED</text>
      <text x="600" y="266" font-size="28" font-weight="700" fill="#0d9465">5</text>

      <rect x="898" y="204" width="300" height="76" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="916" y="234" font-size="11" letter-spacing="2" fill="#64748b">NEXT DOCTOR</text>
      <text x="916" y="266" font-size="22" font-weight="700" fill="#0f172a">Dr. Ananya Sharma</text>
